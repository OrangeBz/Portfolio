name: Actualizar Datos del Sitio

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: 
  push:
    paths:
    
      - 'media/**'
      - 'models/**'
      - 'audio/**'
      - 'projects/**'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Obtener datos de Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: python update_stats.py

      - name: Escanear todo el portafolio
        run: python update_media.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scrobbles.json portfolio_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: actualizar scrobbles y portfolio_data" && git push)