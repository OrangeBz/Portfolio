name: Actualizar Scrobbles de Last.fm

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a la medianoche
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Obtener datos de Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: python root/update_stats.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add root/scrobbles.json scrobbles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: actualizar scrobbles" && git push)
